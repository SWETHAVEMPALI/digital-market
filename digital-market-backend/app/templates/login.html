{% extends "base.html" %}

{% block title %}Login - Digital Market{% endblock %}

{% block content %}
<div class="card">
    <h1>Login</h1>
    <div class="success" id="success-msg"></div>
    <div class="error" id="error-msg"></div>
    
    <form id="login-form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log in</button>
    </form>
    
    <p style="margin-top: 20px;">
        Don't have an account? <a href="/signup">Sign up</a>
    </p>
</div>

<script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    
    // Show success message if just registered
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered')) {
        successMsg.textContent = 'Account created! Please log in.';
        successMsg.style.display = 'block';
    }
    
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';
        
        const formData = new FormData(form);
        
        try {
            // Login endpoint expects form data with username field
            const body = new URLSearchParams();
            body.append('username', formData.get('email'));
            body.append('password', formData.get('password'));
            
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body,
            });
            
            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.detail || 'Login failed');
            }
            
            const data = await response.json();
            
            // Save the token in localStorage
            localStorage.setItem('access_token', data.access_token);
            
            // Redirect to dashboard
            window.location.href = '/dashboard';
        } catch (err) {
            errorMsg.textContent = err.message;
            errorMsg.style.display = 'block';
        }
    });
</script>
{% endblock %}
